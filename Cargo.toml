[package]
name = "cli-assistant"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cli-assistant"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP client for OpenAI API
reqwest = { version = "0.11", features = ["json", "blocking"] }

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal colors
colored = "2.1"

# Error handling
anyhow = "1.0"

# Directory utilities (for home_dir)
dirs = "5.0"

# Signal handling (Ctrl+C)
ctrlc = "3.4"
